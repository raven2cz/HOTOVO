# nginx reverse proxy for HOTOVO (fishlive.org, port-forwarded model).
# Copy to /etc/nginx/sites-available/hotovo, symlink into sites-enabled, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Public access:  https://fishlive.org:17854   (forward external TCP 17854 → Pi in the router)
# nginx terminates TLS on :17854 and proxies to the app on 127.0.0.1:3000.
# Reuses the existing Let's Encrypt cert for fishlive.org (port is irrelevant to the cert).
#
# Because requests arrive proxied (X-Forwarded-* below), HOTOVO disables its
# local-UI auth bypass automatically — every /api request needs a Bearer token.
# Set LOCAL_UI_BYPASS=false in the env too (it's in hotovo.env.example).

server {
    listen 17854 ssl;
    http2 on;
    server_name fishlive.org;

    ssl_certificate     /etc/letsencrypt/live/fishlive.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fishlive.org/privkey.pem;

    # Basic rate limiting.
    limit_req_zone $binary_remote_addr zone=hotovo:10m rate=30r/s;
    limit_req zone=hotovo burst=50 nodelay;

    # Optional extra gate for a personal instance (uncomment + create htpasswd):
    #   sudo htpasswd -c /etc/nginx/.hotovo.htpasswd tonda
    # auth_basic "HOTOVO";
    # auth_basic_user_file /etc/nginx/.hotovo.htpasswd;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
